name: Shipforge Auto-Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          debug: true
          script: |
            set -e

            echo "==> Navigating to Shipforge project directory..."
            cd ~/shipforge

            echo "==> Pulling latest code from repository..."
            git pull origin main

            echo "==> Building and starting all containers..."
            docker compose pull --quiet || true
            docker compose build --no-cache
            docker compose up -d --remove-orphans

            echo "==> Verifying all containers are running..."
            docker compose ps

            echo "==> Running admin creation script (non-fatal if admin already exists)..."
            docker exec shipforge_backend node scripts/create-admin.js || true

            echo "==> Waiting for backend API to become healthy..."
            HEALTHY=false
            for i in $(seq 1 12); do
              if curl -fsSL http://localhost:3000/health > /dev/null 2>&1; then
                echo "Health check passed on attempt $i."
                HEALTHY=true
                break
              fi
              echo "Attempt $i: backend not yet ready, retrying in 5s..."
              sleep 5
            done
            if [ "$HEALTHY" = false ]; then
              echo "WARNING: Backend health check did not pass after 60 seconds. Deployment may need manual verification."
            fi

            echo "==> Deployment complete! All Shipforge services are up and running."
